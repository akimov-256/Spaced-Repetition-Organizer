[package]
name = "SRO"
version = "1.0.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
slint = "1.17.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zune-jpeg = { version = "0.5.13", features = ["log"] }
chrono = "0.4"
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
codegen-units = 1
lto = true

[patch.crates-io]
zune-jpeg = { path = "vendor/zune-jpeg-0.5.13" }