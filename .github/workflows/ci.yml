name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: SRO

jobs:
  # ────────────────────────────────────────────────
  # Runs on every push and PR: build + test
  # ────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # ────────────────────────────────────────────────
  # Runs only on version tags (e.g. v1.0.0): release build + Inno Setup installer
  # ────────────────────────────────────────────────
  release:
    name: Build Release & Publish Installer
    runs-on: windows-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          iscc /DMyAppVersion="${{ steps.version.outputs.VERSION }}" installer\\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-installer-${{ steps.version.outputs.VERSION }}
          path: installer/output/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.BIN_NAME }} ${{ github.ref_name }}
          files: installer/output/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
